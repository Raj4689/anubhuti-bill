<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Dashboard</title><style>*{box-sizing:border-box;font-family:Inter}body{background:#eef2f7;padding:16px}.top-nav{max-width:1100px;margin:0 auto 14px;background:#fff;padding:12px;border-radius:12px;display:flex;justify-content:space-between}.nav-btn{padding:8px 16px;border-radius:8px;font-weight:800;text-decoration:none;font-size:11px}.nav-home{background:#1e3a5f;color:#fff}.nav-dash{background:#f9c00f;color:#000}.sheet{max-width:1100px;margin:auto;background:#fff;padding:20px;border-radius:12px}.card{border:1px solid #e2e8f0;padding:12px;border-radius:10px;margin-top:10px;display:flex;justify-content:space-between}</style></head><body>
<div class="top-nav"><b>📊 CLIENT DASHBOARD</b><div><a class="nav-btn nav-home" href="/">🏠 HOME</a></div></div>
<div class="sheet"><h3>Saved Clients - <span id="c">0</span></h3><div id="list"></div></div>
<script>
function getC(){return JSON.parse(localStorage.getItem('aks_clients')||'[]')}
function render(){let cs=getC();document.getElementById('c').innerText=cs.length;let h='';cs.forEach((c,i)=>{h+=`<div class="card"><div><b>${c.name}</b><br><small>${c.buyer}</small></div><div><button onclick="useC(${i})" style="background:#0ea5e9;color:#fff;border:none;padding:6px 12px;border-radius:6px">USE</button> <button onclick="delC(${i})" style="background:#ef4444;color:#fff;border:none;padding:6px 12px;border-radius:6px">DEL</button></div></div>`});document.getElementById('list').innerHTML=h||'No clients';}
function delC(i){let cs=getC();cs.splice(i,1);localStorage.setItem('aks_clients',JSON.stringify(cs));render();}
function useC(i){localStorage.setItem('aks_selected_client',i);location.href='/';}
render();
</script></body></html>
