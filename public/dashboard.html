<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - ANUBHUTI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,Segoe UI,sans-serif}
body{background:#eef2f7;padding:16px;font-size:13px}
.top-nav{max-width:1100px;margin:0 auto 14px;background:#fff;padding:12px 16px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 20px rgba(0,0,0,0.06)}
.nav-btn{padding:8px 16px;border-radius:8px;font-weight:800;text-decoration:none;font-size:11px;border:none;cursor:pointer}
.nav-home{background:#1e3a5f;color:#fff}
.sheet{max-width:1100px;margin:auto;background:#fff;padding:20px;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,0.1)}
h2{color:#1e3a5f;margin-bottom:12px}
.card{border:1px solid #e2e8f0;padding:14px;border-radius:10px;margin-top:12px;display:flex;justify-content:space-between;align-items:center;background:#f8fafc}
.card b{color:#0f172a}
.btn{padding:7px 14px;border:none;border-radius:7px;font-weight:800;cursor:pointer;font-size:11px;color:#fff;margin-left:6px}
.btn-use{background:#0ea5e9}
.btn-del{background:#ef4444}
.empty{padding:20px;text-align:center;color:#64748b;border:1px dashed #cbd5e1;border-radius:10px;margin-top:10px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:16px}
.stat{background:#0a1931;color:#fff;padding:14px;border-radius:10px;text-align:center}
.stat b{font-size:20px;color:#f9c00f;display:block}
</style>
</head>
<body>

<div class="top-nav">
<div style="font-weight:900;color:#1e3a5f">📊 ANUBHUTI - CLIENT DASHBOARD</div>
<div><a class="nav-btn nav-home" href="/">🏠 HOME - BILL</a></div>
</div>

<div class="sheet">
<div class="stats">
<div class="stat"><span>Total Clients</span><b id="totalC">0</b></div>
<div class="stat"><span>Total Invoices</span><b>∞</b></div>
<div class="stat"><span>Status</span><b style="color:#10b981">LIVE</b></div>
</div>

<h2>Saved Clients Database</h2>
<div id="list"></div>
</div>

<script>
function getClients(){ return JSON.parse(localStorage.getItem('aks_clients')||'[]'); }
function render(){
 let cs = getClients();
 document.getElementById('totalC').innerText = cs.length;
 let h = '';
 if(cs.length==0){ h = '<div class="empty">Abhi koi client save nahi hai.<br>Home pe jake client banao aur SAVE CLIENT dabao!</div>'; }
 cs.forEach((c,i)=>{
   h+= `<div class="card"><div><b>${c.name}</b><br><small>${c.buyer}</small><br><small>GST: ${c.gstin||'-'}</small></div><div><button class="btn btn-use" onclick="useC(${i})">USE</button><button class="btn btn-del" onclick="delC(${i})">DELETE</button></div></div>`;
 });
 document.getElementById('list').innerHTML = h;
}
function delC(i){
 if(!confirm('Delete karna hai?')) return;
 let cs = getClients(); cs.splice(i,1);
 localStorage.setItem('aks_clients', JSON.stringify(cs));
 render();
}
function useC(i){
 localStorage.setItem('aks_selected_client', i);
 window.location.href = '/';
}
render();
</script>
</body>
</html>
