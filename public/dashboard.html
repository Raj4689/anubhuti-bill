<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client Dashboard - ANUBHUTI KSUS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,Segoe UI,sans-serif}
body{background:#eef2f7;padding:16px;font-size:13px}
.top-nav{max-width:1100px;margin:0 auto 14px auto;background:#fff;padding:12px 16px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 20px rgba(0,0,0,0.06)}
.nav-left{font-weight:900;color:#1e3a5f;font-size:15px}
.nav-btn{padding:8px 16px;border:none;border-radius:8px;font-weight:800;cursor:pointer;font-size:11px;text-decoration:none;display:inline-block}
.nav-home{background:#1e3a5f;color:#fff}
.nav-dash{background:#f9c00f;color:#000}
.sheet{max-width:1100px;margin:auto;background:#fff;border-radius:12px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,0.08)}
.search{width:100%;padding:12px;border-radius:10px;border:1.5px solid #cbd5e1;margin:12px 0;font-size:13px}
.client-card{border:1px solid #e2e8f0;padding:14px;border-radius:12px;margin-top:12px;display:flex;justify-content:space-between;align-items:center;background:#f8fafc}
.client-card b{color:#1e3a5f;font-size:14px}
.client-card small{color:#64748b}
.btn{border:none;padding:7px 14px;border-radius:7px;font-weight:800;cursor:pointer;font-size:11px}
.btn-use{background:#0ea5e9;color:#fff}
.btn-del{background:#ef4444;color:#fff;margin-left:6px}
.empty{text-align:center;padding:40px;color:#94a3b8}
.count{font-weight:900;color:#0ea5e9}
</style>
</head>
<body>

<div class="top-nav">
<div class="nav-left">📊 CLIENT DASHBOARD</div>
<div style="display:flex;gap:8px">
<a class="nav-btn nav-home" href="/">🏠 HOME / BILL</a>
<a class="nav-btn nav-dash" href="/dashboard.html">📊 DASHBOARD</a>
</div>
</div>

<div class="sheet">
<h2>Saved Clients - <span class="count" id="count">0</span></h2>
<input id="search" class="search" placeholder="🔍 Search client name..." oninput="render()">
<div id="list"></div>
</div>

<script>
function getClients(){return JSON.parse(localStorage.getItem('aks_clients')||'[]')}
function render(){
let clients=getClients();
let q=document.getElementById('search').value.toLowerCase();
let filtered=clients.filter(c=>c.name.toLowerCase().includes(q));
document.getElementById('count').innerText=filtered.length;
let h='';
filtered.forEach((c,i)=>{
h+=`<div class="client-card">
<div><b>${c.name}</b><br><small>${(c.buyer||'').substring(0,60)}<br>GSTIN: ${c.gstin||'-'}</small></div>
<div><button class="btn btn-use" onclick="useClient(${i})">USE</button><button class="btn btn-del" onclick="delClient(${i})">DEL</button></div>
</div>`;
});
document.getElementById('list').innerHTML=h||'<div class="empty">No clients saved yet!<br>Bill page pe ja ke SAVE CLIENT karo.</div>';
}
function delClient(i){
let clients=getClients();
if(confirm('Delete karna hai: '+clients[i].name+' ?')){
clients.splice(i,1);
localStorage.setItem('aks_clients',JSON.stringify(clients));
render();
}
}
function useClient(i){
localStorage.setItem('aks_selected_client',i);
location.href='/';
}
render();
</script>
</body>
</html>
