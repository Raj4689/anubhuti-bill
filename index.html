<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANUBHUTI KSUS - Billing</title>
<style>
body{font-family:Arial,sans-serif;background:#f0f2f5;padding:10px}
.bill-box{max-width:800px;margin:auto;background:white;padding:20px;border-radius:10px;box-shadow:0 0 10px #ccc}
.header{display:flex;justify-content:space-between;border-bottom:2px solid #1a237e;padding-bottom:10px}
.header h1{color:#1a237e;margin:0;font-size:24px}
.top-inputs{display:flex;gap:10px;margin-top:15px}
.top-inputs input{width:100%;padding:8px;border:1px solid #ccc;border-radius:5px}
.table-head{display:flex;background:#304ffe;color:white;padding:8px;border-radius:5px;margin-top:15px}
.table-head div{flex:1;font-weight:bold}
.item-row{display:flex;gap:5px;margin-top:8px}
.item-row input{flex:1;padding:8px;border:1px solid #ccc;border-radius:5px}
.item-row input:focus{outline:none;border-color:#304ffe}
.total{ text-align:right; margin-top:15px; font-size:18px; }
button{padding:10px 15px;border:none;border-radius:5px;cursor:pointer;color:white;margin:5px}
</style>
</head>
<body>
<div class="bill-box">
  <div class="header">
    <h1>ANUBHUTI KSUS</h1>
    <div style="text-align:right;font-size:13px">
      <b>Invoice No: AK-<span id="inv">5943</span></b><br>
      Date: <span id="date"></span>
    </div>
  </div>

  <div class="top-inputs">
    <div style="flex:1">Customer Name<br><input type="text" placeholder="Customer Name" autocomplete="off"></div>
    <div style="flex:1">Mobile No<br><input type="tel" placeholder="Mobile Number" autocomplete="off"></div>
  </div>

  <div class="table-head">
    <div style="flex:2">Item Name</div><div>Qty</div><div>Price</div><div>Total</div>
  </div>

  <div id="items">
    <div class="item-row">
      <input type="text" style="flex:2" placeholder="Item Name" autocomplete="off" spellcheck="false">
      <input type="number" placeholder="Qty" value="1" oninput="calc()" autocomplete="off">
      <input type="number" placeholder="Price" oninput="calc()" autocomplete="off">
      <input type="text" placeholder="Total" readonly>
    </div>
  </div>

  <center><button style="background:#2e7d32" onclick="addItem()">+ Add Item</button></center>
  <div class="total">Grand Total: ₹ <b id="grand">0</b></div>
  <center>
    <button style="background:#1565c0" onclick="window.print()">PRINT BILL</button>
    <button style="background:#25D366" onclick="shareWA()">WhatsApp Share</button>
  </center>
</div>

<script>
document.getElementById('date').innerText = new Date().toLocaleDateString();
function calc(){
  let grand=0;
  document.querySelectorAll('#items .item-row').forEach(row=>{
    let q=row.children[1].value||0;
    let p=row.children[2].value||0;
    let t=q*p;
    row.children[3].value=t;
    grand+=t;
  });
  document.getElementById('grand').innerText=grand;
}
function addItem(){
  let div=document.createElement('div');
  div.className='item-row';
  div.innerHTML='<input type="text" style="flex:2" placeholder="Item Name" autocomplete="off" spellcheck="false"><input type="number" placeholder="Qty" value="1" oninput="calc()" autocomplete="off"><input type="number" placeholder="Price" oninput="calc()" autocomplete="off"><input type="text" placeholder="Total" readonly>';
  document.getElementById('items').appendChild(div);
}
function shareWA(){
  let total=document.getElementById('grand').innerText;
  let msg=`*ANUBHUTI KSUS*%0ABill Total: Rs ${total}%0AThank you for shopping!`;
  window.open(`https://wa.me/?text=${msg}`,'_blank');
}
calc();
</script>
</body>
</html>
